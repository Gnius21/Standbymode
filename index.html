<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>StandBy</title>
<style>
  :root {
    --muted: #8a8a8e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    background: #000;
    color: #fff;
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", system-ui, sans-serif;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  .stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    container-type: size;
    touch-action: none;
  }
  .carousel {
    position: absolute;
    inset: 0;
    display: flex;
    transition: transform 0.35s cubic-bezier(0.22, 0.61, 0.36, 1);
    will-change: transform;
  }
  .carousel.dragging { transition: none; }
  .face {
    flex: 0 0 100%;
    min-width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    padding:
      calc(env(safe-area-inset-top) + clamp(10px, 4cqh, 40px))
      calc(env(safe-area-inset-right) + clamp(14px, 5cqw, 70px))
      calc(env(safe-area-inset-bottom) + clamp(10px, 4cqh, 40px))
      calc(env(safe-area-inset-left) + clamp(14px, 5cqw, 70px));
  }

  /* ---------- Face 1: Classic ---------- */
  .f-classic { --accent: #6db8ff; --accent-soft: #8fc8ff; gap: clamp(12px, 4cqw, 60px); }
  .f-classic .clock {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    overflow: hidden;
  }
  .f-classic .time {
    font-weight: 700;
    line-height: 0.86;
    letter-spacing: -0.03em;
    color: var(--accent);
    font-size: clamp(60px, 42cqh, 480px);
    font-variant-numeric: tabular-nums;
    display: flex;
    align-items: baseline;
  }
  .colon {
    margin: 0 0.02em;
    transform: translateY(-0.04em);
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }
  .f-classic .ampm {
    font-size: 0.18em;
    font-weight: 700;
    margin-left: 0.15em;
    align-self: flex-end;
    transform: translateY(-0.3em);
    color: var(--accent-soft);
  }
  .f-classic .side {
    flex: 0 0 clamp(140px, 28%, 380px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-width: 0;
  }
  .f-classic .date {
    color: #fff;
    font-weight: 600;
    font-size: clamp(36px, 13cqh, 120px);
    letter-spacing: 0.01em;
    line-height: 1;
  }
  .f-classic .date .day { color: var(--muted); margin-right: 0.4em; }
  .f-classic .fulldate {
    margin-top: clamp(6px, 1.8cqh, 20px);
    color: var(--muted);
    font-weight: 500;
    font-size: clamp(22px, 6cqh, 60px);
    line-height: 1;
  }
  .f-classic .temp {
    margin-top: clamp(16px, 4.5cqh, 48px);
    color: #fff;
    font-weight: 600;
    font-size: clamp(36px, 13cqh, 120px);
    display: flex;
    align-items: center;
    gap: 0.3em;
    line-height: 1;
  }
  .f-classic .temp .ico { font-size: 0.8em; line-height: 1; }
  .f-classic .place {
    margin-top: clamp(4px, 1.5cqh, 16px);
    color: var(--muted);
    font-weight: 500;
    font-size: clamp(18px, 4.8cqh, 48px);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.1;
  }
  .f-classic .extra {
    margin-top: clamp(10px, 3cqh, 28px);
    display: flex;
    flex-direction: column;
    gap: clamp(4px, 1.2cqh, 12px);
  }
  .f-classic .extra-item {
    display: flex;
    align-items: center;
    gap: 0.4em;
    color: var(--muted);
    font-weight: 500;
    font-size: clamp(15px, 4cqh, 40px);
    white-space: nowrap;
    line-height: 1;
  }

  /* ---------- Face 2: Minimal ---------- */
  .f-minimal {
    flex-direction: column;
    justify-content: center;
    text-align: center;
  }
  .f-minimal .time {
    font-weight: 200;
    line-height: 0.9;
    letter-spacing: -0.02em;
    color: #fff;
    font-size: clamp(80px, 58cqh, 560px);
    font-variant-numeric: tabular-nums;
    display: flex;
    align-items: baseline;
    justify-content: center;
  }
  .f-minimal .ampm {
    font-size: 0.14em;
    font-weight: 400;
    margin-left: 0.2em;
    align-self: flex-end;
    transform: translateY(-0.4em);
    color: var(--muted);
  }
  .f-minimal .sub {
    margin-top: clamp(10px, 4cqh, 44px);
    color: var(--muted);
    font-weight: 400;
    font-size: clamp(20px, 7cqh, 64px);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.7em;
    white-space: nowrap;
    line-height: 1;
  }
  .f-minimal .sub .sep { opacity: 0.4; }

  /* ---------- Face 3: Analog ---------- */
  .f-analog { --accent: #ffb45e; gap: clamp(16px, 6cqw, 90px); justify-content: center; }
  .f-analog .dial {
    position: relative;
    flex: 0 0 auto;
    width: min(78cqh, 44cqw);
    height: min(78cqh, 44cqw);
    border-radius: 50%;
    background: radial-gradient(circle at 50% 38%, #1c1c1f, #0a0a0b 72%);
    box-shadow: inset 0 0 0 2px #2a2a2e;
  }
  .f-analog .tick {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 2px;
    height: 50%;
    transform-origin: 50% 0%;
  }
  .f-analog .tick::after {
    content: "";
    position: absolute;
    bottom: 4%;
    left: 50%;
    transform: translateX(-50%);
    width: 2px;
    height: 4.5%;
    background: #45454a;
    border-radius: 2px;
  }
  .f-analog .tick.major::after { width: 4px; height: 8%; background: #9a9aa0; }
  .f-analog .hand {
    position: absolute;
    left: 50%;
    bottom: 50%;
    transform-origin: 50% 100%;
    border-radius: 99px;
  }
  .f-analog .hand.h { width: 2.6%; height: 24%; margin-left: -1.3%; background: #e8e8ec; }
  .f-analog .hand.m { width: 1.8%; height: 36%; margin-left: -0.9%; background: #e8e8ec; }
  .f-analog .hand.s { width: 0.8%; height: 42%; margin-left: -0.4%; background: var(--accent); }
  .f-analog .pin {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 4.5%;
    height: 4.5%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 1.2cqh #000;
  }
  .f-analog .side {
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-width: 0;
  }
  .f-analog .date {
    color: #fff;
    font-weight: 600;
    font-size: clamp(34px, 12cqh, 110px);
    line-height: 1;
  }
  .f-analog .date .day { color: var(--accent); margin-right: 0.4em; }
  .f-analog .fulldate {
    margin-top: clamp(6px, 1.8cqh, 20px);
    color: var(--muted);
    font-weight: 500;
    font-size: clamp(20px, 5.5cqh, 56px);
    line-height: 1;
  }
  .f-analog .temp {
    margin-top: clamp(14px, 4.5cqh, 48px);
    color: #fff;
    font-weight: 600;
    font-size: clamp(34px, 12cqh, 110px);
    display: flex;
    align-items: center;
    gap: 0.3em;
    line-height: 1;
  }
  .f-analog .temp .ico { font-size: 0.8em; }
  .f-analog .place {
    margin-top: clamp(4px, 1.5cqh, 16px);
    color: var(--muted);
    font-weight: 500;
    font-size: clamp(17px, 4.6cqh, 46px);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.1;
  }

  /* ---------- Face 4: Weather ---------- */
  .f-weather { --accent: #5ee6c8; flex-direction: column; justify-content: center; position: relative; }
  .f-weather .smalltime {
    position: absolute;
    top: calc(env(safe-area-inset-top) + clamp(12px, 4cqh, 36px));
    right: calc(env(safe-area-inset-right) + clamp(16px, 5cqw, 70px));
    color: var(--muted);
    font-weight: 600;
    font-size: clamp(20px, 7cqh, 64px);
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .f-weather .main {
    display: flex;
    align-items: center;
    gap: clamp(14px, 4cqw, 56px);
  }
  .f-weather .bigico { font-size: clamp(70px, 34cqh, 320px); line-height: 1; }
  .f-weather .bigtemp {
    font-weight: 700;
    color: #fff;
    font-size: clamp(80px, 42cqh, 400px);
    line-height: 0.9;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }
  .f-weather .cond {
    margin-top: clamp(8px, 3cqh, 32px);
    color: var(--accent);
    font-weight: 600;
    font-size: clamp(24px, 8cqh, 76px);
    line-height: 1;
    text-align: center;
  }
  .f-weather .place {
    margin-top: clamp(4px, 1.5cqh, 16px);
    color: var(--muted);
    font-weight: 500;
    font-size: clamp(18px, 5cqh, 48px);
    line-height: 1.1;
    text-align: center;
  }
  .f-weather .row {
    margin-top: clamp(12px, 4.5cqh, 48px);
    display: flex;
    gap: clamp(20px, 7cqw, 100px);
  }
  .f-weather .row .item {
    display: flex;
    align-items: center;
    gap: 0.4em;
    color: var(--muted);
    font-weight: 500;
    font-size: clamp(16px, 5cqh, 48px);
    white-space: nowrap;
    line-height: 1;
  }

  /* ---------- Dots indicator ---------- */
  .dots {
    position: absolute;
    left: 0;
    right: 0;
    bottom: calc(env(safe-area-inset-bottom) + clamp(8px, 2.5cqh, 22px));
    display: flex;
    justify-content: center;
    gap: clamp(8px, 1.6cqw, 16px);
    z-index: 5;
    pointer-events: none;
  }
  .dots .dot {
    width: clamp(7px, 1.4cqh, 12px);
    height: clamp(7px, 1.4cqh, 12px);
    border-radius: 50%;
    background: #fff;
    opacity: 0.25;
    transition: opacity 0.25s, transform 0.25s;
  }
  .dots .dot.active { opacity: 0.9; transform: scale(1.25); }

  /* Force landscape: when the device is portrait, rotate the whole stage 90 degrees. */
  @media (orientation: portrait) {
    .stage {
      width: 100vh;
      height: 100vw;
      transform: rotate(90deg);
      transform-origin: top left;
      left: 100vw;
      top: 0;
    }
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="carousel" id="carousel">

      <!-- Face 1: Classic -->
      <section class="face f-classic">
        <div class="clock">
          <div class="time">
            <span class="j-hh">5</span><span class="colon">:</span><span class="j-mm">13</span><span class="ampm j-ampm">AM</span>
          </div>
        </div>
        <div class="side">
          <div class="date"><span class="day j-dow">WED</span><span class="j-dom">26</span></div>
          <div class="fulldate j-fulldate">August 26, 2026</div>
          <div class="temp"><span class="ico j-wico">&#x26C5;</span><span class="j-temp">--&deg;</span></div>
          <div class="place j-place">Locating&hellip;</div>
          <div class="extra">
            <span class="extra-item"><span class="extra-ico">&#x1F4A8;</span><span class="j-wind">-- km/h</span></span>
            <span class="extra-item"><span class="extra-ico">&#x1F305;</span><span class="j-sunrise">--:--</span></span>
            <span class="extra-item"><span class="extra-ico">&#x1F307;</span><span class="j-sunset">--:--</span></span>
          </div>
        </div>
      </section>

      <!-- Face 2: Minimal -->
      <section class="face f-minimal">
        <div class="time">
          <span class="j-hh">5</span><span class="colon">:</span><span class="j-mm">13</span><span class="ampm j-ampm">AM</span>
        </div>
        <div class="sub">
          <span><span class="j-dow">WED</span> <span class="j-dom">26</span></span>
          <span class="sep">&middot;</span>
          <span><span class="j-wico">&#x26C5;</span> <span class="j-temp">--&deg;</span></span>
        </div>
      </section>

      <!-- Face 3: Analog -->
      <section class="face f-analog">
        <div class="dial" id="dial">
          <div class="hand h" id="hand-h"></div>
          <div class="hand m" id="hand-m"></div>
          <div class="hand s" id="hand-s"></div>
          <div class="pin"></div>
        </div>
        <div class="side">
          <div class="date"><span class="day j-dow">WED</span><span class="j-dom">26</span></div>
          <div class="fulldate j-fulldate">August 26, 2026</div>
          <div class="temp"><span class="ico j-wico">&#x26C5;</span><span class="j-temp">--&deg;</span></div>
          <div class="place j-place">Locating&hellip;</div>
        </div>
      </section>

      <!-- Face 4: Weather -->
      <section class="face f-weather">
        <div class="smalltime"><span class="j-hh">5</span>:<span class="j-mm">13</span> <span class="j-ampm">AM</span></div>
        <div class="main">
          <span class="bigico j-wico">&#x26C5;</span>
          <span class="bigtemp j-temp">--&deg;</span>
        </div>
        <div class="cond j-wtext">&nbsp;</div>
        <div class="place j-place">Locating&hellip;</div>
        <div class="row">
          <span class="item"><span>&#x1F4A8;</span><span class="j-wind">-- km/h</span></span>
          <span class="item"><span>&#x1F305;</span><span class="j-sunrise">--:--</span></span>
          <span class="item"><span>&#x1F307;</span><span class="j-sunset">--:--</span></span>
        </div>
      </section>

    </div>
    <div class="dots" id="dots"></div>
  </div>

<script>
  const DAYS = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  function setAll(cls, text){
    document.querySelectorAll('.' + cls).forEach(function(el){ el.textContent = text; });
  }

  // ---------- Clock ----------
  const handH = document.getElementById('hand-h');
  const handM = document.getElementById('hand-m');
  const handS = document.getElementById('hand-s');

  function tick(){
    const now = new Date();
    const h12 = (now.getHours() % 12) || 12;
    setAll('j-hh', h12);
    setAll('j-mm', String(now.getMinutes()).padStart(2,'0'));
    setAll('j-ampm', now.getHours() < 12 ? 'AM' : 'PM');
    setAll('j-dow', DAYS[now.getDay()]);
    setAll('j-dom', now.getDate());
    setAll('j-fulldate', MONTHS[now.getMonth()] + ' ' + now.getDate() + ', ' + now.getFullYear());

    const s = now.getSeconds();
    const m = now.getMinutes() + s / 60;
    const h = (now.getHours() % 12) + m / 60;
    handS.style.transform = 'rotate(' + (s * 6) + 'deg)';
    handM.style.transform = 'rotate(' + (m * 6) + 'deg)';
    handH.style.transform = 'rotate(' + (h * 30) + 'deg)';
  }
  tick(); setInterval(tick, 1000);

  // Analog dial tick marks
  (function(){
    const dial = document.getElementById('dial');
    for (let i = 0; i < 60; i++){
      const t = document.createElement('div');
      t.className = 'tick' + (i % 5 === 0 ? ' major' : '');
      t.style.transform = 'rotate(' + (i * 6) + 'deg)';
      dial.insertBefore(t, dial.firstChild);
    }
  })();

  // ---------- Weather ----------
  function wmoIcon(c){
    if(c===0) return '☀️';
    if(c<=2) return '🌤️';
    if(c===3) return '☁️';
    if(c<=48) return '🌫️';
    if(c<=57) return '🌦️';
    if(c<=67) return '🌧️';
    if(c<=77) return '🌨️';
    if(c<=82) return '🌧️';
    if(c<=86) return '🌨️';
    return '⛈️';
  }

  function wmoText(c){
    if(c===0) return 'Clear';
    if(c<=2) return 'Partly cloudy';
    if(c===3) return 'Overcast';
    if(c<=48) return 'Fog';
    if(c<=57) return 'Drizzle';
    if(c<=67) return 'Rain';
    if(c<=77) return 'Snow';
    if(c<=82) return 'Showers';
    if(c<=86) return 'Snow showers';
    return 'Thunderstorm';
  }

  function fmtTime(iso){
    const t = iso.split('T')[1];
    const [h,m] = t.split(':');
    let hh = parseInt(h,10);
    const ap = hh<12 ? 'AM':'PM';
    hh = (hh%12)||12;
    return hh+':'+m+' '+ap;
  }

  // ---------- KNMI Bonaire live scraper (from RWC Caribbean) ----------
  const KNMI_URL = 'https://www.knmidc.org/weather/bonaire/?Current';

  async function fetchKnmiPage(){
    const proxies = [
      function(u){ return 'https://api.allorigins.win/raw?url='+encodeURIComponent(u); },
      function(u){ return 'https://r.jina.ai/'+u; },
      function(u){ return u; }
    ];
    for(var i=0;i<proxies.length;i++){
      try{
        var ctrl=new AbortController(), t=setTimeout(function(){ctrl.abort();},8000);
        var r=await fetch(proxies[i](KNMI_URL),{signal:ctrl.signal});
        clearTimeout(t);
        if(r.ok){var text=await r.text(); if(text&&text.length>500) return text;}
      }catch(e){}
    }
    return null;
  }

  function parseKnmiBonaire(raw){
    if(!raw) return null;
    var html=String(raw).replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&');
    var out={};
    var tm=html.match(/Bonaire<br\s*\/?>([^<]+UTC)/i);
    if(tm) out.time=tm[1].trim();
    var rowRe=/<td[^>]*>\s*<smalli>\s*([^<]+?)\s*<\/td>\s*<th[^>]*>\s*<center>\s*([^<]+?)\s*(?:<smalli>\s*([^<]*?)\s*(?:<\/smalli>)?)?\s*<\/th>/gi, m;
    while((m=rowRe.exec(html))!==null){
      var label=m[1].replace(/&deg;/g,'°').replace(/\s+/g,' ').trim();
      var value=(m[2]||'').replace(/&nbsp;/g,' ').trim();
      var extra=(m[3]||'').replace(/[()%]/g,'').trim();
      out[label]={value:value,extra:extra};
    }
    if(Object.keys(out).filter(function(k){return k!=='time';}).length>=3) return out;
    var text=html.replace(/<[^>]+>/g,' ').replace(/&deg;/g,'°').replace(/&nbsp;/g,' ').replace(/\s+/g,' ');
    var pairs=[
      ['Winddirection (Sector/deg)',/Winddirection[^A-Za-z]*\(?Sector\/deg\)?\s*([NESW]{1,3})\s*\(?\s*(\d{1,3})/i,true],
      ['Windspeed',/Windspeed[^0-9-]*([\d.]+)/i],
      ['Gusts',/Gusts[^0-9-]*([\d.]+)/i],
      ['Cloud cover',/Cloud cover[^0-9-]*([\d.]+)/i],
      ['Radiation',/Radiation[^0-9-]*([\d.]+)/i],
      ['Precipitation',/Precipitation[^0-9-]*([\d.]+)/i],
      ['Relative humidity',/Relative humidity[^0-9-]*([\d.]+)/i],
      ['Temperature (°C)',/Temperature[^0-9-]*(-?[\d.]+)/i],
      ['Dewpoint',/Dewpoint[^0-9-]*(-?[\d.]+)/i],
      ['Visibility',/Visibility[^0-9-]*([\d.]+)/i],
      ['Pressure',/Pressure[^0-9-]*([\d.]+)/i]
    ];
    pairs.forEach(function(p){
      var mm=text.match(p[1]);
      if(mm) out[p[0]]={value:p[2]?mm[1]:mm[1],extra:p[2]?(mm[2]||''):''};
    });
    if(!out.time){var tt=text.match(/Bonaire\s+([A-Za-z]{3},?\s+\d{1,2}\s+\w+\s+\d{4}\s+[\d:]+\s*UTC)/); if(tt) out.time=tt[1].trim();}
    return out;
  }

  function knmiToNormalized(parsed){
    if(!parsed) return null;
    function find(sub){for(var k in parsed){if(k.indexOf(sub)>=0) return parsed[k];} return null;}
    function num(rec){if(!rec||rec.value==null) return null; var n=parseFloat(rec.value); return isFinite(n)?n:null;}
    var windMs=num(find('Windspeed')), gustMs=num(find('Gusts')), wd=find('Winddirection');
    return {
      temp_c:     num(find('Temperature (')),
      rh:         num(find('Relative humidity')),
      wind_kt:    windMs!=null?Math.round(windMs*1.94384):null,
      gust_kt:    gustMs!=null?Math.round(gustMs*1.94384):null,
      wind_dir:   wd&&wd.extra?parseFloat(wd.extra):null,
      cloud_octa: num(find('Cloud cover')),
      precip_10m: num(find('Precipitation')),
      time:       parsed.time||null
    };
  }

  // Derive icon/text from cloud cover + precipitation (for KNMI data)
  function cloudIcon(octa, precip){
    if(precip!=null&&precip>0.2) return '🌧️';
    if(octa==null) return '⛅';
    if(octa<=1) return '☀️';
    if(octa<=3) return '🌤️';
    if(octa<=5) return '⛅';
    return '☁️';
  }
  function cloudText(octa, precip){
    if(precip!=null&&precip>0.2) return 'Rain';
    if(octa==null) return '';
    if(octa<=1) return 'Clear';
    if(octa<=3) return 'Partly cloudy';
    if(octa<=5) return 'Mostly cloudy';
    return 'Overcast';
  }

  // Fetch sunrise/sunset from Open-Meteo (daily, light request)
  async function fetchSunriseSunset(lat, lon){
    const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&daily=sunrise,sunset&timezone=auto&forecast_days=1');
    if(!r.ok) throw new Error('http '+r.status);
    const d=await r.json();
    return {sunrise:d.daily.sunrise[0], sunset:d.daily.sunset[0]};
  }

  async function loadWeather(){
    let knmiOk=false;
    try{
      const raw=await fetchKnmiPage();
      const data=knmiToNormalized(parseKnmiBonaire(raw));
      if(data&&data.temp_c!=null){
        setAll('j-temp', Math.round(data.temp_c)+'°');
        setAll('j-wico', cloudIcon(data.cloud_octa, data.precip_10m));
        setAll('j-wtext', cloudText(data.cloud_octa, data.precip_10m));
        setAll('j-wind', data.wind_kt!=null ? Math.round(data.wind_kt*1.852)+' km/h' : '-- km/h');
        setAll('j-place', 'Bonaire · KNMI');
        knmiOk=true;
      }
    }catch(e){}

    if(!knmiOk){
      try{
        const url='https://api.open-meteo.com/v1/forecast?latitude=12.17&longitude=-68.99&current=temperature_2m,weather_code,wind_speed_10m&temperature_unit=celsius&wind_speed_unit=kmh&timezone=auto';
        const r=await fetch(url); if(!r.ok) throw new Error('http '+r.status);
        const d=await r.json();
        setAll('j-temp', Math.round(d.current.temperature_2m)+'°');
        setAll('j-wico', wmoIcon(d.current.weather_code));
        setAll('j-wtext', wmoText(d.current.weather_code));
        setAll('j-wind', Math.round(d.current.wind_speed_10m)+' km/h');
        setAll('j-place', 'Curaçao');
      }catch(e){
        setAll('j-temp', '--°');
        setAll('j-wind', '-- km/h');
        setAll('j-place', 'Curaçao');
      }
    }

    // Sunrise/sunset always from Open-Meteo (KNMI doesn't provide it)
    try{
      const ss=await fetchSunriseSunset(12.17,-68.99);
      setAll('j-sunrise', fmtTime(ss.sunrise));
      setAll('j-sunset', fmtTime(ss.sunset));
    }catch(e){}
  }

  setAll('j-place', 'Curaçao');
  loadWeather();
  setInterval(loadWeather, 10*60*1000);

  // ---------- Swipeable faces ----------
  const stage = document.getElementById('stage');
  const carousel = document.getElementById('carousel');
  const dotsEl = document.getElementById('dots');
  const FACES = carousel.children.length;
  let index = Math.min(FACES-1, Math.max(0, parseInt(localStorage.getItem('faceIndex')||'0',10) || 0));

  for(let i=0;i<FACES;i++){
    const d = document.createElement('div');
    d.className = 'dot';
    dotsEl.appendChild(d);
  }

  function render(dx){
    carousel.style.transform = 'translateX(calc(' + (-index*100) + '% + ' + (dx||0) + 'px))';
    dotsEl.querySelectorAll('.dot').forEach(function(d,i){
      d.classList.toggle('active', i===index);
    });
  }

  function goTo(i){
    index = Math.min(FACES-1, Math.max(0, i));
    localStorage.setItem('faceIndex', index);
    render(0);
  }
  goTo(index);

  // The stage may be rotated 90deg in portrait, so map screen coordinates
  // onto the stage's own horizontal axis.
  function axisPos(ev){
    return matchMedia('(orientation: portrait)').matches ? ev.clientY : ev.clientX;
  }

  let dragStart = null, dragDx = 0, dragT = 0;
  stage.addEventListener('pointerdown', function(ev){
    dragStart = axisPos(ev);
    dragDx = 0;
    dragT = Date.now();
    carousel.classList.add('dragging');
    stage.setPointerCapture(ev.pointerId);
  });
  stage.addEventListener('pointermove', function(ev){
    if(dragStart === null) return;
    dragDx = axisPos(ev) - dragStart;
    // resist dragging past the ends
    if((index===0 && dragDx>0) || (index===FACES-1 && dragDx<0)) dragDx *= 0.35;
    render(dragDx);
  });
  function endDrag(){
    if(dragStart === null) return;
    carousel.classList.remove('dragging');
    const dt = Date.now() - dragT;
    const w = stage.clientWidth;
    const fling = Math.abs(dragDx) > 30 && dt < 250;
    if(Math.abs(dragDx) > w*0.18 || fling){
      goTo(index + (dragDx < 0 ? 1 : -1));
    }else if(Math.abs(dragDx) < 8 && dt < 350){
      toggleFullscreen();
      render(0);
    }else{
      render(0);
    }
    dragStart = null; dragDx = 0;
  }
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);

  document.addEventListener('keydown', function(ev){
    if(ev.key === 'ArrowRight') goTo(index+1);
    if(ev.key === 'ArrowLeft') goTo(index-1);
  });

  function toggleFullscreen(){
    if(!document.fullscreenElement && document.documentElement.requestFullscreen){
      document.documentElement.requestFullscreen().catch(function(){});
    }else if(document.exitFullscreen){
      document.exitFullscreen().catch(function(){});
    }
  }
</script>
